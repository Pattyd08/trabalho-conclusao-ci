name: "04 -Execução Integrada"
permissions:
  contents: write

# gatilhos / triggers - regras de disparo
# gatilho manual = workflow_dispatch
# gatilho agendado = schedule
# gatilho por conclusão de outra pipeline = workflow_run

on:
  workflow_dispatch:

  push:
    branches:
      - main
#tarefas dentro da pipeline = jobs

jobs:
  #nome do job
  inspecao:
    # maquina onde o job vai rodar
    runs-on: ubuntu-latest

    # passos do job
    steps:
      # clone do projeto
      - uses: actions/checkout@v4

      # instalção do node
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      # instalação do Yarn
      - name: Instalando Yarn
        run: npm install -g yarn

      # instalação das dependências
      - name: Instalando dependências
        run: yarn

      - name: Inspeção de Código
        run: yarn lint

  unidade:
    runs-on: ubuntu-latest
    needs: [inspecao]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Instalando Yarn
        run: npm install -g yarn

      - name: Instalando dependências
        run: yarn

      - name: Instalando Browsers do Playwright
        run: npx playwright install --with-deps

      - name: Rodando testes unitários
        run: yarn run test

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [inspecao]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Instalando Yarn
        run: npm install -g yarn

      - name: Instalando dependências
        run: yarn

      - name: Instalando Browsers do Playwright
        run: yarn playwright install --with-deps

      - name: Executando testes E2E
        run: yarn run e2e

      # 1. Este passo baixa o histórico anterior para manter os gráficos de evolução
      - name: Coletar histórico do Allure
        uses: actions/checkout@v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-dir

      # 2. Este passo junta os testes novos com o histórico e monta a página web
      - name: Gerar Allure Report com Histórico
        uses: simple-elf/allure-report-action@master
        if: ${{ always() }}
        with:
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history/integrado
          keep_reports: 20

      # 3. Este passo publica a página web gerada no GitHub Pages do seu repositório
      - name: Publicar relatório no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ always() }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history


  deploy:
    runs-on: ubuntu-latest
    needs: [unidade, e2e-tests]

    steps:
      - name: Simulação de Deploy
        run: echo 'Deploy sendo realizado...'
