# CI de Nível 01 - Disparo Manual através de clique

# nome da pipeline
name: "01 - Execução Manual"

# gatilhos / triggers - regras de disparo
# gatilho manual = workflow_dispatch

on:
  workflow_dispatch:

#tarefas dentro da pipeline = jobs

jobs:
  #nome do job
  e2e-tests:
    # maquina onde o job vai rodar
    runs-on: ubuntu-latest

    # passos do job
    steps:
      # clone do projeto
      - uses: actions/checkout@v4

      # instalção do node
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # instalação do Yarn
      - name: Instalando Yarn
        run: npm install -g yarn

      #   instalação das dependências
      - name: Instalando dependências
        run: yarn install

      # instalação dos Browsers do Playwright
      - name: Instalando Browsers do Playwright
        run: yarn playwright install --with-deps

      # executar os testes e2e
      - name: Executando testes e2e
        run: yarn run e2e

      - name: Gerar Histórico do Allure Report
        uses: simple-elf/allure-report-action@1.9.0
        if: ${{ always() }}
        with:
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history

      - name: Salvando relatórios do Allure como Artefato
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: Allure-Report
          path: allure-report/
